[package]
name = "ytamp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "YouTube Music, native and skinned. A Rust + egui player with Winamp .wsz skins, a spectrum analyser, and a 10-band EQ."
repository = "https://github.com/CentauriAgent/ytamp"
keywords = ["youtube-music", "winamp", "egui", "music-player", "skins"]
categories = ["multimedia::audio"]

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
directories = "6"

# The whole UI. glow keeps the binary and the dependency tree small; wgpu is
# not needed for a 2D music client. Same feature set fastpotify ships.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "links", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image"] }

# Winamp skins are BMP sprite sheets inside a zip (.wsz).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
flate2 = "1"
# Filling glyph outlines with no anti-aliasing for the Winamp playlist text.
tiny-skia = "0.11"
# The font-outline parser epaint already rasterizes with; the playlist's
# pixel text cannot use egui's own glyph runs (they are smoothed).
skrifa = "0.44"

# Audio output and decoding.
rodio = { version = "0.21", default-features = false, features = ["playback"] }
cpal = "0.16"
symphonia = { version = "0.5", features = ["aac", "isomp4"] }

# InnerTube client + streaming.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }

rand = "0.9"
open = "5"
urlencoding = "2"
jiff = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Audio decoding and immediate-mode layout are too slow at opt-level 0 to
# audition the app in development. Keep every dependency optimized while the
# application crate itself stays incremental. (Same trade-off fastpotify makes.)
[profile.dev.package."*"]
opt-level = 2
